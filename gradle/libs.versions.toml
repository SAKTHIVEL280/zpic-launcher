[versions]
agp = "9.5.0"
kotlin = "2.4.21"
bom = "2026.09.00"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "bom" }
material3 = { module = "androidx.compose.material3:material3", version = "1.5.0-rc01" }
icons = { module = "androidx.compose.material:material-icons-extended" }
ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.13.0" }
core-ktx = { module = "androidx.core:core-ktx", version = "1.18.0" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.3.0" }
graphics-shapes = { module = "androidx.graphics:graphics-shapes", version = "1.0.1" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.9.0" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version = "1.4.1" }
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
